[package]
name = "tauri-plugin-mcp"
version = "0.3.1"
authors = [ "Pegleg" ]
description = "A Tauri plugin that enables AI agents to interact with GUIs through screenshots, DOM access, and input simulation utilizing MCP"
edition = "2024"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-mcp"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
# Only JPEG is needed by the plugin itself (screenshot encoding); other formats are opt-in features.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
interprocess = { version = "2.2.3", features = ["tokio"] }
log = { version = "0.4", features = ["std"] }
parking_lot = "0.12"
serde = "1.0"
serde_json = "1.0"
tauri = { version = "2.11", features = ["unstable"] }
thiserror = "2"
subtle = "2"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = "0.22.3"
foreign-types-shared = "0.1"
xcap = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
xcap = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
win-screenshot = "4.0.5"

[features]
default = ["image-png"]
devtools = ["tauri/devtools"]
# Image formats, forwarded to the `image` crate. The plugin only needs JPEG, which is always on;
# these are for apps that use `image` themselves and relied on the formats the plugin used to enable.
# PNG stays on by default because earlier versions named it explicitly; the plugin doesn't need it.
image-png = ["image/png"]
image-bmp = ["image/bmp"]
image-gif = ["image/gif"]
image-webp = ["image/webp"]
image-tiff = ["image/tiff"]
image-avif = ["image/avif"]
# Every format `image` enables by default, as earlier versions did.
image-default-formats = ["image/default-formats"]
# Parallel pixel iterators, and threading for the AVIF and EXR codecs; on by default in image.
image-rayon = ["image/rayon"]

[build-dependencies]
tauri-plugin = { version = "2.5", features = ["build"] }


[profile.dev.package."*"]
opt-level = 0  # Force dependencies to compile with minimal optimization
